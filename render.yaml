databases:
  - name: collectivite-db
    plan: free
    databaseName: collectivite
    user: collectivite

services:
  - type: web
    name: collectivite-recettes
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn collectivite.wsgi"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: collectivite-recettes.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://collectivite-recettes.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: collectivite-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.3"
