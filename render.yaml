databases:
  - name: collectivite-db
    plan: free
    databaseName: collectivite
    user: collectivite

envVarGroups:
  - name: collectivite-mail
    envVars:
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_USE_SSL
        value: "false"
      - key: DEFAULT_FROM_EMAIL
        sync: false

services:
  - type: web
    name: collectivite-recettes
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "python manage.py creer_admin && gunicorn collectivite.wsgi"
    disk:
      name: collectivite-media
      mountPath: /var/data
      sizeGB: 1
    envVarGroups:
      - collectivite-mail
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: collectivite-recettes.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://collectivite-recettes.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: collectivite-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DJANGO_MEDIA_ROOT
        value: /var/data/media
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
  - type: cron
    name: collectivite-notifications
    runtime: python
    plan: starter
    schedule: "0 4 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py boucle_taches --une-fois"
    envVarGroups:
      - collectivite-mail
    envVars:
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: collectivite-recettes
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_DEBUG
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: collectivite-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.3"
